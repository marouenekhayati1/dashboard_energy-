<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDUS · Connexion</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1 class="logo-title">⚡ INDUS</h1>

        <p class="logo-subtitle">
            Monitoring des utilités · Connexion
        </p>

        <div id="login-error"
             class="alert alert-critical hidden">
        </div>

        <label for="login-tech">Technicien</label>

        <select id="login-tech">
            <option value="">
                Chargement...
            </option>
        </select>

        <label for="login-matricule">
            Matricule
        </label>

        <input
            type="password"
            id="login-matricule"
            placeholder="Votre matricule"
            onkeydown="if(event.key==='Enter') doLogin()">

        <button
            class="btn btn-primary"
            onclick="doLogin()">

            Accéder au monitoring →
        </button>

        <a class="auth-link"
           href="register.html">

           ➕ Créer un compte
        </a>

    </div>

</div>

<script>
(function () {
    const theme =
        localStorage.getItem("theme") || "dark";

    document.documentElement.setAttribute(
        "data-theme",
        theme
    );
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

if (getSession()) {
    window.location.href =
        "dashboard.html";
}

async function loadTechnicians() {

    const select =
        document.getElementById(
            "login-tech"
        );

    const { data, error } =
        await db
            .from("technicians")
            .select("*")
            .eq("is_active", true)
            .order("first_name");

    if (error ||
        !data ||
        data.length === 0) {

        select.innerHTML =
            '<option>Aucun technicien</option>';

        return;
    }

    let html =
        '<option value="">— Sélectionner —</option>';

    data.forEach(t => {

        html += `
            <option value="${t.id}">
                ${t.first_name}
                ${t.last_name}
            </option>
        `;
    });

    select.innerHTML = html;
}

async function doLogin() {

    document
        .getElementById("login-error")
        .classList.add("hidden");

    const technician =
        document.getElementById(
            "login-tech"
        ).value;

    const matricule =
        document.getElementById(
            "login-matricule"
        ).value.trim();

    if (!technician)
        return showError(
            "Sélectionnez un technicien."
        );

    if (!matricule)
        return showError(
            "Entrez votre matricule."
        );

    const { data, error } =
        await db
            .from("technicians")
            .select("*")
            .eq("id", technician)
            .eq("matricule", matricule)
            .eq("is_active", true)
            .maybeSingle();

    if (error)
        return showError(error.message);

    if (!data)
        return showError(
            "Matricule incorrect."
        );

    setSession({
        id: data.id,
        first_name: data.first_name,
        last_name: data.last_name,
        matricule: data.matricule,
        role: data.role
    });

    window.location.href =
        "dashboard.html";
}

function showError(msg) {

    const box =
        document.getElementById(
            "login-error"
        );

    box.textContent = msg;
    box.classList.remove("hidden");
}

document.addEventListener(
    "DOMContentLoaded",
    loadTechnicians
);

</script>

</body>
</html>
