<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDUS · Connexion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lora:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1 class="logo-title">⚡ INDUS</h1>

        <p class="logo-subtitle">
            Monitoring des utilités · Connexion
        </p>

        <div id="login-error" class="alert alert-critical hidden"></div>

        <form id="login-form" novalidate>
            <label for="login-tech">Technicien</label>

            <select id="login-tech">
                <option value="">Chargement...</option>
            </select>

            <label for="login-matricule">Matricule</label>

            <input
                type="password"
                id="login-matricule"
                placeholder="Votre matricule"
                autocomplete="off"
            >

            <button type="submit" class="btn btn-primary" id="login-button">
                Accéder au monitoring →
            </button>
        </form>

        <a class="auth-link" href="register.html">
           ➕ Créer un compte
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/services/supabaseService.js"></script>
<script src="js/theme.js"></script>
<script src="js/pages/login.js"></script>

</body>
</html>
