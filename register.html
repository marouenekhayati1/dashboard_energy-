<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDUS · Créer un compte</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1 class="logo-title">⚡ INDUS</h1>

        <p class="logo-subtitle">
            Créer un nouveau compte technicien
        </p>

        <div id="reg-error"
             class="alert alert-critical hidden">
        </div>

        <label for="reg-first">
            Prénom *
        </label>

        <input
            type="text"
            id="reg-first"
            placeholder="Ex : Jean">

        <label for="reg-last">
            Nom *
        </label>

        <input
            type="text"
            id="reg-last"
            placeholder="Ex : Dupont">

        <label for="reg-matricule">
            Matricule *
        </label>

        <input
            type="text"
            id="reg-matricule"
            placeholder="Ex : T1234">

        <button
            class="btn btn-primary"
            onclick="doRegister()">

            ✅ Créer mon compte
        </button>

        <a class="auth-link"
           href="index.html">

           ← Retour à la connexion
        </a>

    </div>

</div>

<script>
(function () {
    const theme =
        localStorage.getItem("theme") || "dark";

    document.documentElement.setAttribute(
        "data-theme",
        theme
    );
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="js/config.js"></script>

<script>

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

async function doRegister() {

    document
        .getElementById("reg-error")
        .classList.add("hidden");

    const first =
        document.getElementById(
            "reg-first"
        ).value.trim();

    const last =
        document.getElementById(
            "reg-last"
        ).value.trim();

    const matricule =
        document.getElementById(
            "reg-matricule"
        ).value.trim();

    if (!first || !last)
        return showError(
            "Entrez votre prénom et votre nom."
        );

    if (!matricule)
        return showError(
            "Entrez un matricule."
        );

    const { data: existing } =
        await db
            .from("technicians")
            .select("id")
            .eq("matricule", matricule)
            .maybeSingle();

    if (existing)
        return showError(
            "Ce matricule est déjà utilisé."
        );

    const { error } =
        await db
            .from("technicians")
            .insert({
                first_name: first,
                last_name: last,
                matricule: matricule,
                role: "technician",
                is_active: true
            });

    if (error)
        return showError(error.message);

    alert(
        "✅ Compte créé !"
    );

    window.location.href =
        "index.html";
}

function showError(msg) {

    const box =
        document.getElementById(
            "reg-error"
        );

    box.textContent = msg;
    box.classList.remove("hidden");
}

</script>

</body>
</html>
