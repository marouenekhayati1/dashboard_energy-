<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Utilités - Check-list</title>

<link rel="stylesheet" href="css/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lora:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* HEADER */

.topbar {
    height: 70px;
    background: var(--sidebar);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.logo span {
    color: var(--primary);
}

.user-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.badge {
    background: var(--primary);
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
}

.theme-btn {
    font-size: 18px;
    padding: 8px 12px !important;
    line-height: 1;
}

/* MENU MOBILE (caché sur ordinateur) */

#mobile-nav {
    display: none;
    width: auto;
    max-width: 200px;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    top: 70px;
    left: 0;
    width: 260px;
    height: calc(100vh - 70px);
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 20px 12px;
    overflow-y: auto;
}

.menu-title {
    font-size: 11px;
    color: var(--muted);
    margin: 15px 10px 8px;
    text-transform: uppercase;
}

.menu-item {
    padding: 13px 15px;
    margin-bottom: 5px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--menu-color);
    transition: 0.2s;
}

.menu-item:hover {
    background: var(--card);
}

.menu-item.active {
    background: var(--primary);
    color: white;
}

/* CONTENT */

.main {
    margin-left: 260px;
    margin-top: 70px;
    padding: 30px;
    min-height: calc(100vh - 70px);
}

.page-header {
    margin-bottom: 25px;
}

.page-header h1 {
    font-size: 28px;
}

.page-header p {
    color: var(--muted);
    margin-top: 7px;
}

/* TOP CONTROLS */

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
}

.control-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 18px;
    border-radius: 12px;
}

.control-card label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
}

select,
input,
textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--foreground);
    padding: 11px;
    border-radius: var(--radius);
    font-size: 14px;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: var(--ring);
}

.field-error {
    color: #d14343;
    font-size: 12px;
    margin: -4px 0 10px;
}

.field-error[hidden] {
    display: none;
}

/* DASHBOARD */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 18px;
}

.dashboard-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 22px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: 0.2s;
}

.dashboard-card:hover {
    transform: translateY(-3px);
    border-color: var(--primary);
}

.dashboard-icon {
    font-size: 32px;
    margin-bottom: 15px;
}

.dashboard-card h3 {
    margin-bottom: 8px;
}

.dashboard-card p {
    font-size: 13px;
    color: var(--muted);
}

.dashboard-card-status {
    display: inline-flex;
    margin-top: 10px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 12px;
}

.dashboard-card.is-locked {
    background: #2a2c33;
    border-color: #8c5cff;
    color: var(--foreground);
}

.dashboard-card.is-locked p {
    color: var(--muted);
}

.dashboard-card-status.is-locked {
    border-color: var(--border);
    color: #8c5cff;
}

.dashboard-card-status.is-draft {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(140, 92, 255, 0.08);
}

.dashboard-card-edit {
    display: block;
    margin-top: 12px;
    padding: 6px 12px;
    font-size: 12px;
}

.dashboard-card-edit[hidden] {
    display: none;
}

/* TABLEAU HISTORIQUE */

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
}

.table-wrap {
    overflow-x: auto;
}

.history-sort {
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    text-transform: inherit;
    cursor: pointer;
}

.history-column-filter {
    min-width: 110px;
    padding: 7px;
    font-size: 12px;
}

.history-v2-modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    place-items: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.68);
}

.history-v2-modal.show {
    display: grid;
}

.history-v2-dialog {
    width: min(700px, 100%);
    max-height: 85vh;
    overflow: auto;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
}

.history-v2-dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
}

.history-v2-dialog-header h2 {
    font-size: 20px;
}

.water-consumption-table {
    min-width: 1500px;
    table-layout: fixed;
}

.water-consumption-table th:first-child,
.water-consumption-table td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    min-width: 110px;
    background: var(--card);
}

.water-consumption-table th:not(:first-child),
.water-consumption-table td:not(:first-child) {
    min-width: 125px;
    text-align: center;
}

.water-consumption-table th small,
.water-consumption-table td small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
    text-transform: none;
}

.water-consumption-table td strong {
    font-size: 15px;
}

.water-consumption-alert {
    color: var(--warning);
    font-weight: 600;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
}

th {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

tr:hover td {
    background: var(--hover-row);
}

/* FORM */

.section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
}

.section-header {
    padding: 16px 20px;
    background: var(--card-light);
    font-size: 17px;
    font-weight: bold;
}

.section-body {
    padding: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.form-group label {
    display: block;
    font-size: 13px;
    margin-bottom: 7px;
    color: var(--label-color);
}

.range-info {
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
}

.status {
    font-size: 12px;
    margin-top: 6px;
    font-weight: bold;
}

.status.ok {
    color: #22c55e;
}

.status.error {
    color: #ef4444;
}

.hidden {
    display: none !important;
}

/* RADIO */

.radio-group {
    display: flex;
    gap: 10px;
}

.radio-option {
    flex: 1;
}

.radio-option input {
    display: none;
}

.radio-option label {
    display: block;
    padding: 11px;
    text-align: center;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
}

.radio-option input:checked + label {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

/* BUTTON */

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin: 25px 0;
}

.btn {
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.btn-secondary {
    background: var(--secondary);
    color: var(--secondary-foreground);
}

.btn-primary {
    background: var(--primary);
    color: var(--primary-foreground);
}

.btn-success {
    background: var(--success);
    color: white;
}

/* MOBILE - TABLETTE */

/* DESKTOP : menu horizontal en haut */
@media(min-width: 901px) {
    .sidebar {
        top: 70px;
        left: 0;
        width: 100%;
        height: auto;
        padding: 8px 20px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        z-index: 90;
    }

    .menu-title { display: none; }
    .menu-item { white-space: nowrap; margin: 0; padding: 10px 14px; }
    .main { margin-left: 0; margin-top: 120px; }
}

@media(max-width: 900px) {

    .sidebar {
        width: 70px;
    }

    .sidebar .menu-item {
        font-size: 0;
        text-align: center;
    }

    .sidebar .menu-item::first-letter {
        font-size: 20px;
    }

    .menu-title {
        display: none;
    }

    .main {
        margin-left: 70px;
    }

    .form-grid {
        grid-template-columns: 1fr 1fr;
    }
}

/* MOBILE - TÉLÉPHONE */

@media(max-width: 600px) {

    .sidebar {
        display: none;
    }

    #mobile-nav {
        display: block;
        max-width: 130px;
        font-size: 12px;
        padding: 8px;
    }

    /* HEADER sur 2 lignes pour que tous les boutons soient accessibles */
    .topbar {
        padding: 8px 12px;
        height: auto;
        flex-wrap: wrap;
        gap: 8px;
    }

    .logo {
        font-size: 17px;
    }

    .user-info {
        width: 100%;
        justify-content: space-between;
        gap: 8px;
    }

    .badge {
        font-size: 11px;
        padding: 6px 10px;
    }

    .theme-btn {
        padding: 6px 10px !important;
        font-size: 16px;
    }

    .user-info .btn {
        padding: 8px 10px !important;
        font-size: 12px;
    }

    .main {
        margin-left: 0;
        padding: 15px;
        margin-top: 115px; /* place pour le header sur 2 lignes */
    }

    .controls,
    .form-grid {
        grid-template-columns: 1fr;
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .actions {
        flex-direction: column;
    }

    .actions .btn {
        width: 100%;
    }

    .form-grid .form-group {
        min-width: 0;
    }

    textarea {
        width: 100%;
    }

    .page-header h1 {
        font-size: 22px;
    }

    .btn {
        min-height: 44px; /* boutons facilement tapables au doigt */
    }
}

/* DESKTOP : navigation déroulante comme sur mobile */
@media (min-width:901px) {
    .sidebar {
        display:none !important;
    }

    #mobile-nav {
        display:block !important;
        width:240px !important;
        max-width:240px !important;
        margin-left:auto;
        margin-right:20px;
        padding:8px 10px;
        font-size:13px;
    }

    .main {
        margin-left:0 !important;
        margin-top:70px !important;
    }
}
